name: Security Scan
on:
  pull_request: # This event triggers the workflow when a pull request is opened, synchronized (updated), or reopened. It allows the workflow to run security scans on the code changes proposed in the pull request.
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
permissions:
  contents: read
  security-events: write # This permission is required to create security alerts in the repository. It allows the workflow to report any security issues it finds during the scan.

jobs:
  dependency-scan:
    name: Dependency Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Trivy Filesystem Scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs # This specifies that the scan should be performed on the filesystem of the repository. It checks for vulnerabilities in the files and directories of the codebase.
          scan-ref: . # This specifies the reference point for the scan. In this case, it is set to the current directory (.) of the repository, meaning that the scan will be performed on the entire codebase.
          format: sarif # This specifies that the output format of the scan results should be in SARIF (Static Analysis Results Interchange Format). SARIF is a standardized format for representing static analysis results, which can be consumed by various tools and platforms.
          severity: CRITICAL,HIGH # This specifies the severity levels of vulnerabilities to be reported in the scan results. In this case, only vulnerabilities with CRITICAL, HIGH severity will be included in the output.
          ignore-unfixed: true # This tells Trivy to ignore vulnerabilities that have not been fixed.
          exit-code: 1 # This specifies the exit code that Trivy should return if vulnerabilities are found. An exit code of 1 indicates that vulnerabilities were detected, which can be used to fail the workflow step and alert the developers.
          output: trivy-results.sarif # This specifies the name of the file where the scan results will be saved. The results will be stored in a file named "trivy-results.sarif" in the root directory of the repository.

      - name: Upload Trivy Results
        if: always() && steps.trivy-scan.outcome != 'cancelled' # This condition ensures that the upload step is executed regardless of the outcome of the Trivy scan step, as long as it was not cancelled. It allows the workflow to upload the results even if vulnerabilities were found or if the scan failed.
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif # This specifies the path to the SARIF file generated by the Trivy scan. The upload-sarif action will take this file and upload it to GitHub, where it can be viewed in the Security tab of the repository.

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}} # This environment variable provides the GitHub token to the Gitleaks action, allowing it to authenticate with the GitHub API and access the repository for scanning.

  sbom-generation:
    name: Generate SBOM
    runs-on: ubuntu-latest
    permissions:
      contents: read

      steps:
        - name: Checkout Repositoy
          uses: actions/checkout@v4

        - name: Generate SBOM
          uses: aquasecurity/trivy-action@v0.36.0
          with:
            scan-type: fs # This specifies that the scan should be performed on the filesystem of the repository. It checks for vulnerabilities in the files and directories of the codebase.
            scan-ref: . # This specifies the reference point for the scan. In this case, it is set to the current directory (.) of the repository, meaning that the scan will be performed on the entire codebase.
            format: cyclonedx # This specifies that the output format of the scan results should be in CycloneDX format. CycloneDX is a lightweight SBOM (Software Bill of Materials) standard that provides a comprehensive inventory of the components and dependencies used in the software.
            output: sbom.cdx.json # This specifies the name of the file where the SBOM will be saved. The results will be stored in a file named "sbom.cdx.json" in the root directory of the repository.

        - name: Upload SBOM
          uses: actions/upload-artifact@v4
          with:
            name: sbom # This specifies the name of the artifact to be uploaded. The SBOM file will be uploaded as an artifact with the name "sbom".
            path: sbom.cdx.json # This specifies the path to the SBOM file that will be uploaded as an artifact. The upload-artifact action will take this file and make it available for download in the workflow run artifacts.
            retention-days: 30 # This specifies the number of days the uploaded artifact will be retained. In this case, the SBOM artifact will be kept for 30 days before being automatically deleted.

  codeql-analysis:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # This permission is required to read the workflow's actions and their metadata.
      security-events: write # This permission is required to create security alerts in the repository. It allows the workflow to report any security issues it finds during the CodeQL analysis.

      steps:
        - name: checkout Repository
          uses: actions/checkout@v4

        - name: Initialize CodeQL
          uses: github/codeql-action/init@v3
          with:
            languages: typescript, javascript # This specifies the programming language(s) to be analyzed by CodeQL. In this case, it is set to TypeScript and JavaScript, which means that CodeQL will analyze the TypeScript and JavaScript code in the repository for potential security vulnerabilities and code quality issues.

        - name: Setup Node.js
          uses: actions/setup-node@v4
          with:
            node-version: 20 # This specifies the version of Node.js to be used in the workflow. In this case, it is set to version 20, which means that the workflow will use Node.js version 20 for running the CodeQL analysis and any other Node.js-related tasks.
            cache: "npm" # This enables caching for npm dependencies, which can speed up the workflow by reusing previously installed packages.

        - name: Install Dependencies
          run: npm install

        - name: Build Application
          run: npm run build

        - name: Perform CodeQL Analysis
          uses: github/codeql-action/analyze@v3

  security-summary:
    name: Security Summary
    runs-on: ubuntu-latest

    needs:
      - dependency-scan
      - secret-scan
      - sbom-generation
      - codeql-analysis

    if: always() # This condition ensures that the security summary job runs regardless of the outcome of the previous jobs. It allows the workflow to generate a summary of the security scan results even if some of the scans failed or were skipped.

    steps:
      - name: Generate Security Summary
        run: |
          echo "# NepalStay Security Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Security Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "| ---------------- | ------ |" >> $GITHUB_STEP_SUMMARY
          echo "| Dependency Scan | ${{needs.dependency-scan-result}} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secret Scan | ${{needs.secret-scan-result}} |" >> $GITHUB_STEP_SUMMARY
          echo "| SBOM Generation | ${{needs.sbom-generation-result}} |" >> $GITHUB_STEP_SUMMARY
          echo "| CodeQL Analysis | ${{needs.codeql-analysis-result}} |" >> $GITHUB_STEP_SUMMARY
