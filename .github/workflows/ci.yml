name: Continuous Integration

on:
  push:
    branches:
      - develop
      - main
      - "feature/**"
  pull_request:
    branches:
      - develop
      - main
permissions:
  contents: read
  

concurrency:
  group: ci-${{github.workflow}}-${{github.ref}} # This ensures that only one job from this workflow can run at a time for a specific branch or tag. for example, if you push multiple commits to the same branch, only the latest commit will be built and tested.
  cancel-in-progress: true # This cancels any in-progress jobs from the same workflow if a new job is triggered. for example, if you push multiple commits to the same branch, only the latest commit will be built and tested.
jobs:
  build-test:
    name: Build, Test and Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Type Check
        run: npm run typecheck

      - name: Run Unit Tests
        run: npm test

      - name: Build Application
        run: npm run build

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: next-build # This is the name of the artifact that will be uploaded. It can be any string that you choose, and it will be used to identify the artifact in the GitHub Actions interface.
          path: .next # path means the directory or file to upload as an artifact. In this case, it is the .next directory which contains the build output of a Next.js application.
          retention-days: 7
