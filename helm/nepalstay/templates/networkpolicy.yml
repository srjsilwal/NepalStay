apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: nepalstay
  namespace: {{ .Release.Namespace }}
spec:
  podSelector:
    matchLabels:
      app: nepalstay
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 3000
  egress:
    - ports:
        - protocol: TCP
          port: 443
    - ports:
        - protocol: UDP
          port: 53
      to:
        - namespaceSelector: {}
